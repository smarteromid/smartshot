    const ALL_STYLES = CATEGORIZED_GALLERY.flatMap(cat => cat.options);

    const MODAL_TABS = [

    const PRODUCT_SCALES = [
      { id: 'normal', name: 'اندازه واقعی و استاندارد کالا' },
      { id: 'tiny', name: 'بسیار کوچک (مثل انگشتر یا عطر جیبی)' },

    const ASPECT_RATIOS = [
      { id: '1:1', label: '1:1 (مربع اینستاگرام / وب‌سایت)' },
      { id: '3:4', label: '3:4 (عمودی استاندارد)' },
      { id: '4:3', label: '4:3 (افقی استاندارد)' },
      { id: '4:5', label: '4:5 (پرتره اینستاگرام)' },
      { id: '16:9', label: '16:9 (عریض افقی)' },
      { id: '9:16', label: '9:16 (استوری و ریلز)' }
    ];

    function App() {
      const fileInputRef = useRef(null);
      const cameraInputRef = useRef(null);

      // Empty API key as required by Canvas environment - automatically injected at runtime
      const apiKey = ""; 

      const [isStyleModalOpen, setIsStyleModalOpen] = useState(false);
      const [modalSearch, setModalSearch] = useState('');
      const [activeModalTab, setActiveModalTab] = useState(0);

      const [activeInfoStyle, setActiveInfoStyle] = useState(null);

      const [productImages, setProductImages] = useState([]);
      const [productCategoryType, setProductCategoryType] = useState('auto');
      const [customProductName, setCustomProductName] = useState('');
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [analysisIdeas, setAnalysisIdeas] = useState([]);

      const [generatedPrompt, setGeneratedPrompt] = useState('');
      const [isGeneratingPrompt, setIsGeneratingPrompt] = useState(false);

      const [renderedImage, setRenderedImage] = useState(null);
      const [isGeneratingImage, setIsGeneratingImage] = useState(false);

      const [toastMessage, setToastMessage] = useState('');
      const [showToast, setShowToast] = useState(false);
      const [copySuccess, setCopySuccess] = useState(false);

      const [isRetouching, setIsRetouching] = useState(false);

      const [selectedStyles, setSelectedStyles] = useState([]);
      const [productScale, setProductScale] = useState('normal');
      const [customDescription, setCustomDescription] = useState('');
      
      const [aspectRatio, setAspectRatio] = useState('1:1');
      const [promptLanguage, setPromptLanguage] = useState('fa');
      const [promptDetailLevel, setPromptDetailLevel] = useState('advanced');
      
      const [includeHumanModel, setIncludeHumanModel] = useState(false);
      const [includeAccessories, setIncludeAccessories] = useState(true);
      const [iranianModelSetting, setIranianModelSetting] = useState('any');
      
      const [selectedPromptModel, setSelectedPromptModel] = useState('gemini-3-flash-preview');
      const [selectedImageModel, setSelectedImageModel] = useState('gemini-3.1-flash-image');

      const [preserveShape, setPreserveShape] = useState(false);
      const [preserveAngle, setPreserveAngle] = useState(false);
      const [consistencyLock, setConsistencyLock] = useState(true);
      const [fixedSeed, setFixedSeed] = useState(1042);

      const triggerToast = (msg) => {
        setToastMessage(msg);
        setShowToast(true);
        setTimeout(() => setShowToast(false), 4000);
      };

      const toggleStyleSelection = (styleId) => {
        setSelectedStyles(prev => {
          if (prev.includes(styleId)) {
            return prev.filter(id => id !== styleId);
          } else {
            return [...prev, styleId];
          }
        });
      };

      const resetAllSettings = () => {
        setProductImages([]);
        setProductCategoryType('auto');
        setCustomProductName('');
        setSelectedStyles([]);
        setProductScale('normal');
        setCustomDescription('');
        setAspectRatio('1:1');
        setPromptLanguage('fa');
        setPromptDetailLevel('advanced');
        setIncludeHumanModel(false);
        setIncludeAccessories(true);
        setIranianModelSetting('any');
        setGeneratedPrompt('');
        setRenderedImage(null);
        setAnalysisIdeas([]);
        triggerToast('تمام تنظیمات و تصاویر بازنشانی شدند.');
      };

      const copyToClipboard = (text) => {
        if (!text) return;
        try {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          textarea.style.position = 'fixed';
          textarea.style.opacity = '0';
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          document.body.removeChild(textarea);
          triggerToast('متن در حافظه کپی شد.');
        } catch {
          triggerToast('خطا در کپی متن.');
        }
      };

      const downloadImageInBrowser = (dataUrl) => {
        if (!dataUrl) return;
        const link = document.createElement('a');
        link.href = dataUrl;
        link.download = `smartshot-${Date.now()}.png`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        triggerToast('تصویر با موفقیت در پوشه دانلود / گالری ذخیره شد.');
      };

      const callGeminiWithRetry = async (url, payload, retries = 3, delay = 1000) => {
        for (let i = 0; i < retries; i++) {
          try {
            const res = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            if (res.status === 429 && i < retries - 1) {
              await new Promise(r => setTimeout(r, delay * Math.pow(2, i)));
              continue;
            }
            if (!res.ok) {
              const errText = await res.text();
              throw new Error(`خطای ارتباط با هوش مصنوعی (${res.status}): ${errText}`);
            }
            return await res.json();
          } catch (err) {
            if (i === retries - 1) throw err;
            await new Promise(r => setTimeout(r, delay * Math.pow(2, i)));
          }
        }
      };

      const handleImageUpload = (e) => {
        const files = Array.from(e.target.files || []);
        if (!files.length) return;

        files.forEach(file => {
          const reader = new FileReader();
          reader.onload = (evt) => {
            setProductImages(prev => {
              if (prev.length >= 3) return prev;
              return [...prev, evt.target.result];
            });
          };
          reader.readAsDataURL(file);
        });
        e.target.value = '';
      };

      const removeProductImage = (index) => {
        setProductImages(prev => prev.filter((_, i) => i !== index));
      };

      const autoSelectSmartStyle = async () => {
        if (!productImages.length) {
          triggerToast('لطفاً ابتدا تصویر محصول را آپلود کنید.');
          return;
        }
        setIsAnalyzing(true);
        try {
          const base64Data = productImages[0].split(',')[1];
          const availableStyles = CATEGORIZED_GALLERY
            .filter(cat => cat.id !== 'creative_mega_prompts')
            .flatMap(cat => cat.options);
          const styleListStr = availableStyles.map(s => `id: "${s.id}" (${s.name})`).join('\n');

          const payload = {
            contents: [{
              role: "user",
              parts: [
                { text: `این تصویر را بررسی کن. نام دقیق و نوع کالا را به صورت بسیار مختصر (حداکثر ۲ یا ۳ کلمه) مشخص کن. سپس ۳ الی ۵ سبک مناسب از لیست زیر برای عکاسی استودیویی انتخاب کن.\nلیست سبک‌ها:\n${styleListStr}\nپاسخ را فقط به صورت JSON با ساختار {"detectedName": "نام کالا", "selectedStyles": ["id1", "id2"]} بفرست.` },
                { inlineData: { mimeType: "image/png", data: base64Data } }
              ]
            }]
          };
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
          const data = await callGeminiWithRetry(apiUrl, payload);
          const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
          if (text) {
            const match = text.match(/\{[\s\S]*\}/);
            if (match) {
              const parsed = JSON.parse(match[0]);
              if (parsed.detectedName) setCustomProductName(parsed.detectedName);
              if (Array.isArray(parsed.selectedStyles) && parsed.selectedStyles.length > 0) {
                const valid = parsed.selectedStyles.filter(id => ALL_STYLES.some(s => s.id === id));
                if (valid.length > 0) setSelectedStyles(valid);
              }
              triggerToast('کالا و سبک‌های متناسب تشخیص داده شدند!');
            }
          }
        } catch (err) {
          console.error(err);
          triggerToast(err.message || 'خطا در ارتباط با هوش مصنوعی.');
        } finally {
          setIsAnalyzing(false);
        }
      };

      const analyzeProductSpatialIdeas = async () => {
        if (!productImages.length) {
          triggerToast('لطفاً عکس محصول را آپلود کنید.');
          return;
        }
        setIsAnalyzing(true);
        setAnalysisIdeas([]);

        const base64Data = productImages[0].split(',')[1];
        let modelDirective = includeHumanModel ? "یک مدل انسانی متناسب با محصول در صحنه حضور داشته باشد." : "بدون حضور مدل انسانی.";
        let accessoryDirective = includeAccessories ? "همراه با اکسسوری‌های مینیمال مرتبط." : "بدون اکسسوری اضافه.";

        const systemPrompt = `تو کارگردان عکاسی تبلیغاتی هستی. این کالا را بررسی کن و ۲ ایده سناریو فضاسازی عکاسی شیک ارائه بده.\nمدل: ${modelDirective}\nاکسسوری: ${accessoryDirective}\nخروجی فقط ۲ خط تیتروار باشد.`;

        const payload = {
          contents: [{
            role: "user",
            parts: [
              { text: "۲ ایده عکاسی استودیویی تیتروار بنویس." },
              { inlineData: { mimeType: "image/png", data: base64Data } }
            ]
          }],
          systemInstruction: { parts: [{ text: systemPrompt }] }
        };

        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

        try {
          const data = await callGeminiWithRetry(apiUrl, payload);
          const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
          if (text) {
            const lines = text.split('\n').map(l => l.replace(/^[*\-•\d.]+\s*/, '').trim()).filter(l => l.length > 10);
            setAnalysisIdeas(lines.slice(0, 2));
            triggerToast('۲ ایده فضاسازی استخراج شد.');
          }
        } catch (error) {
          console.error(error);
          triggerToast(error.message || 'خطا در آنالیز تصویر.');
        } finally {
          setIsAnalyzing(false);
        }
      };

      const generateMegaPrompt = async () => {
        setIsGeneratingPrompt(true);
        const selectedStyleObjs = ALL_STYLES.filter(s => selectedStyles.includes(s.id));
        const styleText = selectedStyleObjs.map(s => `${s.name}: ${s.desc}`).join(' | ') || "سبک مینیمال استودیویی مدرن";
        const scaleObj = PRODUCT_SCALES.find(s => s.id === productScale);

        const mandatoryPreservationText = "حفظ کامل متریال، بافت، رنگ، جزئیات بسته‌بندی، متون و لوگوهای محصول اصلی. هوش مصنوعی مجاز است فرم، انحنا، زاویه و نحوه قرارگیری کالا (مثلاً گرد شدن فرم دستبند یا تا خوردگی لباس) را برای طبیعی‌تر شدن در صحنه جدید تطبیق دهد. هرگونه متن یا لوگوی اضافی در پس‌زمینه باید حذف شود";

        const consistencyDirective = consistencyLock 
          ? `\n[تثبیت هندسه و تقارن دکور برای تکرارپذیری ۱۰۰٪]: چیدمان دکور، زاویه دوربین، موقعیت کالا (دقیقاً در مرکز با مختصات ثابت X:50%, Y:50%)، زاویه نور اصلی (۴۵ درجه چپ، ۵۶۰۰ کلوین) و فواصل دقیق المان‌های پس‌زمینه را فیکس کن.`
          : '';

        const promptInstructions = `
نگارش مگاپرامپت عکاسی تبلیغاتی تجاری فوق‌العاده باکیفیت به زبان ${promptLanguage === 'fa' ? 'فارسی' : 'انگلیسی'}.
۱. عبارت آغازین الزامی: "${mandatoryPreservationText}"
۲. نام کالا: "${customProductName || 'کالای نمایش داده شده در تصویر'}"
۳. سبک‌های انتخابی: ${styleText}
۴. نسبت ابعاد: ${aspectRatio}، مقیاس: ${scaleObj?.name}${consistencyDirective}
۵. توضیحات اضافه: ${customDescription || "محصول اصلی در مرکز کادر"}
۶. قانون نور: هیچ سافت‌باکس یا پایه نوری در کادر دیده نشود، فقط بازتاب زیبای نور بر محصول باشد.
`;

        const payload = {
          contents: [{
            parts: [{ text: promptInstructions }],
            ...(productImages.length > 0 ? [{ inlineData: { mimeType: "image/png", data: productImages[0].split(',')[1] } }] : [])
          }]
        };

        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${selectedPromptModel}:generateContent?key=${apiKey}`;

        try {
          const data = await callGeminiWithRetry(apiUrl, payload);
          const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
          if (text) {
            setGeneratedPrompt(text.trim());
            triggerToast('پرامپت اختصاصی ساخته شد!');
          }
        } catch (error) {
          console.error(error);
          triggerToast(error.message || 'خطا در ساخت پرامپت.');
        } finally {
          setIsGeneratingPrompt(false);
        }
      };

      const generateProductVisual = async () => {
        if (!generatedPrompt) {
          triggerToast('ابتدا پرامپت را تولید کنید.');
          return;
        }
        if (!productImages.length) {
          triggerToast('عکس محصول الزامی است.');
          return;
        }

        setIsGeneratingImage(true);
        setRenderedImage(null);

        try {
          const base64Data = productImages[0].split(',')[1];
          const shapeDirective = preserveShape 
            ? "Keep the exact physical shape and bending of the product exactly as it appears in the input image." 
            : "You are explicitly allowed to adjust the physical posture, bending, or shape of the product (e.g., curving a bracelet naturally) so it sits realistically in the scene.";
          
          const angleDirective = preserveAngle 
            ? "Keep the exact camera angle and perspective of the product exactly as it appears in the input image." 
            : "You are free to choose the most flattering camera angle and perspective for the product.";

          const consistencyAnchor = consistencyLock 
            ? `[DETERMINISTIC COMPOSITION LOCK]: Seed ${fixedSeed}. Maintain exact spatial coordinates, fixed prop arrangements, exact pedestal height, and exact lighting setup.` 
            : "";

          const payload = {
            contents: [{
              role: "user",
              parts: [
                { text: `[STRICT MANDATE FOR ASPECT RATIO: EXACTLY ${aspectRatio}]. Ultra-high 8K fidelity commercial studio photo render. Commercial advertisement photo composition in ${aspectRatio}. CRITICAL MANDATE 1: Keep the original product labels, exact text, logos, packaging, materials, and colors 100% untouched. ${shapeDirective} ${angleDirective} ${consistencyAnchor} CRITICAL MANDATE 2: Softboxes and physical lighting fixtures or stands MUST NEVER be visible inside the frame. Details: ${generatedPrompt}` },
                { inlineData: { mimeType: "image/png", data: base64Data } }
              ]
            }],
            generationConfig: {
              responseModalities: ['TEXT', 'IMAGE'],
              ...(aspectRatio ? { imageConfig: { aspectRatio: aspectRatio } } : {})
            }
          };

          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${selectedImageModel}:generateContent?key=${apiKey}`;
          const res = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (!res.ok) {
            const errBody = await res.text();

                  ) : (
                    <div className="text-center p-6 space-y-2">
                      <Icon name="camera" className="w-10 h-10 text-slate-800 mx-auto" />
                      <p className="text-xs text-slate-500">تصویر ساخته‌شده اینجا نمایش داده می‌شود</p>
                    </div>
                  )}
                </div>

                {renderedImage && (
                  <div className="space-y-2.5 pt-1">
                    <button
                      onClick={() => downloadImageInBrowser(renderedImage)}
                      className="w-full p-3.5 bg-gradient-to-r from-amber-500 via-orange-500 to-rose-500 hover:from-amber-600 hover:to-rose-600 text-slate-950 font-black rounded-xl text-center text-xs flex items-center justify-center gap-2 shadow-xl cursor-pointer transition-all active:scale-95"
                    >
                      <Icon name="download" className="w-4 h-4" />
                      <span>دانلود مستقیم تصویر در سیستم / گالری</span>
                    </button>

                    <button
                      onClick={() => {
                        copyToClipboard(renderedImage);
                        setCopySuccess(true);
                        setTimeout(() => setCopySuccess(false), 3000);
                      }}
                      className="w-full py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl text-xs flex items-center justify-center gap-1.5 border border-slate-700 cursor-pointer"
                    >
                      {copySuccess ? <Icon name="check" className="w-3.5 h-3.5 text-emerald-400" /> : <Icon name="copy" className="w-3.5 h-3.5" />}
                      <span>{copySuccess ? 'کپی شد!' : 'کپی پیوند Base64 تصویر'}</span>
                    </button>
                  </div>
                )}
              </section>
            </div>
          </main>

          {isStyleModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-2 sm:p-5">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-4xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
                <div className="p-3 sm:p-4 border-b border-slate-800 flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <Icon name="sliders" className="w-5 h-5 text-amber-400" />
                    <h2 className="text-sm font-bold text-slate-100">گالری سبک‌های عکاسی استودیویی</h2>
                  </div>
                  <button onClick={() => setIsStyleModalOpen(false)} className="p-1 text-slate-400 hover:text-white cursor-pointer">
                    <Icon name="close" className="w-5 h-5" />
                  </button>
                </div>

                <div className="bg-slate-950 p-2 flex items-center gap-1.5 overflow-x-auto scrollbar-none border-b border-slate-800">
                  {MODAL_TABS.map((tab, idx) => (
                    <button
                      key={idx}
                      onClick={() => setActiveModalTab(idx)}
                      className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all cursor-pointer ${
                        activeModalTab === idx ? 'bg-amber-500 text-slate-950' : 'bg-slate-900 text-slate-400 hover:text-slate-200'
                      }`}
                    >
                      <span>{tab.icon} {tab.name}</span>
                    </button>
                  ))}
                </div>

                <div className="p-2 border-b border-slate-800">
                  <input
                    type="text"
                    value={modalSearch}
                    onChange={(e) => setModalSearch(e.target.value)}
                    placeholder="جستجو در سبک‌ها..."
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-slate-200 outline-none focus:border-amber-500"
                  />
                </div>

                <div className="flex-1 overflow-y-auto p-4 space-y-4">
                  {MODAL_TABS[activeModalTab].categories.map(catId => {
                    const cat = CATEGORIZED_GALLERY.find(c => c.id === catId);
                    if (!cat) return null;
                    const filtered = cat.options.filter(o => o.name.includes(modalSearch) || o.desc.includes(modalSearch));
                    if (!filtered.length) return null;

                    return (
                      <div key={cat.id} className="space-y-2 bg-slate-950/40 p-3 rounded-xl border border-slate-850">
                        <h4 className="text-xs font-bold text-amber-400">{cat.icon} {cat.category}</h4>
                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2">
                          {filtered.map(opt => {
                            const isSelected = selectedStyles.includes(opt.id);
                            return (
                              <div
                                key={opt.id}
                                onClick={() => toggleStyleSelection(opt.id)}
                                className={`p-2.5 rounded-xl border cursor-pointer transition-all ${
                                  isSelected
                                    ? 'border-amber-500 bg-amber-500/20 text-amber-300 font-bold'
                                    : 'border-slate-800 bg-slate-950 text-slate-300 hover:border-slate-700'
                                }`}
                              >
                                <span className="text-xs block font-bold truncate">{opt.name}</span>
                                <span className="text-[10px] text-slate-500 block truncate mt-1">{opt.desc}</span>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    );
                  })}
                </div>

                <div className="p-3 border-t border-slate-800 flex justify-between items-center bg-slate-900/95 sticky bottom-0">
                  <button onClick={() => setSelectedStyles([])} className="text-xs text-rose-400 font-bold px-3 py-1.5 rounded-xl hover:bg-slate-800 cursor-pointer">پاکسازی</button>
                  <button onClick={() => setIsStyleModalOpen(false)} className="px-5 py-2 bg-amber-500 hover:bg-amber-600 transition-colors text-slate-950 font-bold text-xs rounded-xl shadow-lg shadow-amber-500/20 cursor-pointer">
                    تایید انتخاب‌ها ({selectedStyles.length})
                  </button>
                </div>
              </div>
            </div>
          )}

          {showToast && (
            <div className="fixed bottom-4 left-4 z-50 bg-slate-900 border border-amber-500/40 text-amber-200 px-4 py-2.5 rounded-xl shadow-2xl flex items-center gap-2">
              <Icon name="sparkles" className="w-4 h-4 text-amber-400 flex-shrink-0" />
              <span className="text-xs font-semibold">{toastMessage}</span>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
